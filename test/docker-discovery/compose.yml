services:
  router:
    build:
        context: ../..
        dockerfile: Dockerfile
    environment:
      IN_DOCKER: true
    ports:
      - "25565:25565"
    volumes:
      # NOTE: this also works fine when developing on Windows since it will mount from the docker VMs filesystem
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Matches MCs below
    network_mode: bridge
    # If getting "Permission denied" errors for the docker socket
    # change this group ID to match your system. Group ID 999 is the default for Docker Desktop's VM.
    # Find the group ID by using `stat -c '%g' /var/run/docker.sock` on your host
    user: ":999"

  vanilla:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
    labels:
      mc-router.host: "localhost"
    # To allow for routing from devcontainer
    network_mode: bridge
  paper:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: PAPER
    labels:
      mc-router.host: "paper.example.com"
    # To allow for routing from devcontainer
    network_mode: bridge

