version: '3.8'

services:
  router:
    image: itzg/mc-router:latest
    command: --in-docker-swarm
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - "25565:25565"
    networks:
      - minecraft
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # If getting "Permission denied" errors for the docker socket
    # change this group ID to match your system. Group ID 999 is the default for Docker Desktop's VM.
    # Find the group ID by using `stat -c '%g' /var/run/docker.sock` on your host
    user: ":999"

  mcfoobar:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "mc-router.host=foo.host.name,bar.host.name"
        - "mc-router.network=minecraft" # not required in this case
    volumes:
      - mcfoobardata:/data
    networks:
      - minecraft
    environment:
      EULA: "true"

  mcbaz:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "mc-router.host=baz.host.name"
        - "mc-router.network=minecraft" # required since we are exposing a port
    ports:
      - "25575:25575" # RCON
    volumes:
      - mcbazdata:/data
    networks:
      - minecraft
    environment:
      EULA: "true"

volumes:
  mcbazdata:
  mcfoobardata:


networks:
  minecraft:
    driver: overlay
