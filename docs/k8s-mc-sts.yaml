---
apiVersion: v1
kind: Service
metadata:
  name: mc-latest
  annotations:
    "mc-router.itzg.me/defaultServer": "true"
    "mc-router.itzg.me/autoScaleUp": "true"
    "mc-router.itzg.me/autoScaleDown": "true"
spec:
  type: NodePort
  ports:
  - port: 25565
    name: minecraft
  selector:
    app: mc-latest
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: mc-latest
  labels:
    app: mc-latest
spec:
  selector:
    matchLabels:
      app: mc-latest
  serviceName: "mc-latest"
  template:
    metadata:
      labels:
        app: mc-latest
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - image: itzg/minecraft-server
        name: mc-latest
        env:
        - name: EULA
          value: "TRUE"
        ports:
        - containerPort: 25565
---
apiVersion: v1
kind: Service
metadata:
  name: mc-paper
  annotations:
    # Replace localhost with public hostname of your mc-router host or port-forwarded address
    "mc-router.itzg.me/externalServerName": "paper.localhost,alt.localhost"
    # auto scale
    "mc-router.itzg.me/autoScale": "true"
spec:
  type: NodePort
  ports:
  - port: 25565
    name: minecraft
  selector:
    app: mc-paper
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: mc-paper
  labels:
    app: mc-paper
spec:
  selector:
    matchLabels:
      app: mc-paper
  serviceName: "mc-paper"
  template:
    metadata:
      labels:
        app: mc-paper
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - image: itzg/minecraft-server
        name: mc-paper
        env:
        - name: EULA
          value: "TRUE"
        - name: TYPE
          value: paper
        ports:
        - containerPort: 25565