services:
  mcfoo:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      MOTD: "foo"
    volumes:
      - mcfoodata:/data
    labels:
      mc-router.host: "foo.localhost"
      mc-router.default: true
  mcbar:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      MOTD: "bar"
    volumes:
      - mcbardata:/data
    labels:
      mc-router.host: "bar.localhost"
  router:
    image: itzg/mc-router:latest
    command: "-debug -in-docker"
    depends_on:
      - mcfoo
      - mcbar
    ports:
      - "25565:25565"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # If getting "Permission denied" errors for the docker socket
    # change this group ID to match your system. Group ID 999 is the default for Docker Desktop's VM.
    # Find the group ID by using `stat -c '%g' /var/run/docker.sock` on your host
    user: ":999"

volumes:
  mcfoodata:
  mcbardata:
