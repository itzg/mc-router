
# This YAML is an example and is not intended to be directly applied.
# It consists of 3 parts
# 1. the mc-router with service account an service 
# 2. the shutdown cronjob with service account
# 3. the actual server with service and storage

# part 3 is the only part you need to replicate for the number of servers you want

# mc-router
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mc-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: services-watcher
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["watch","list"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["watch","list","patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets/scale"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mc-router-services-watcher
subjects:
- kind: ServiceAccount
  name: mc-router
  namespace: default
roleRef:
  kind: ClusterRole
  name: services-watcher
  apiGroup: rbac.authorization.k8s.io
# Use whatever tcp ingress method you want I just used a node port here for simplicity
---
apiVersion: v1
kind: Service
metadata:
  name: mc-router
spec:
  type: NodePort
  externalIPs:
    - 192.168.1.100
  ports:
  - targetPort: web
    name: web
    port: 8080
    nodePort: 30001
  - targetPort: proxy
    name: proxy
    port: 25565
    nodePort: 30000
  selector:
    run: mc-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: mc-router
  name: mc-router
spec:
  selector:
    matchLabels:
      run: mc-router
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        run: mc-router
    spec:
      serviceAccountName: mc-router
      containers:
      - image: itzg/mc-router:latest
        imagePullPolicy: Always
        name: mc-router
        env:
          - name: IN_KUBE_CLUSTER
            value: "true"
          - name: AUTO_SCALE_UP
            value: "true"
          - name: AUTO_SCALE_DOWN
            value: "true"
          - name: AUTO_SCALE_DOWN_AFTER
            value: "1m"
          - name: DEBUG
            value: "true"
          - name: API_BINDING
            value: ":8080"
        ports:
        - name: proxy
          containerPort: 25565
        - name: web
          containerPort: 8080
        resources:
          requests:
            memory: 50Mi
            cpu: "100m"
          limits:
            memory: 100Mi
            cpu: "250m"

# The actual minecraft servers, services and storage, repeat this block for as many servers as you want
# make sure you have the label containertype=minecraft-server this is used to find running servers
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft-servername-deployment
  labels:
    app: minecraft-servername-container
spec:
  serviceName: minecraft-servername-deployment
  selector:
    matchLabels:
      app: minecraft-servername-container 
  replicas: 0
  template:
    metadata:
      labels:
        app: minecraft-servername-container
        containertype: minecraft-server
    spec:
      containers:
      - name: minecraft-servername-deployment
        image: itzg/minecraft-server:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "2048Mi"
        env:
          # Use secret in real usage
        - name: EULA
          value: "true"
        # let the JVM figure out mem management
        - name: "MEMORY"
          value: ""
        - name: JVM_XX_OPTS
          value: "-XX:MaxRAMPercentage=75"
        ports:
        - containerPort: 25565
          name: main
        readinessProbe:
          exec:
            command: [ "/usr/local/bin/mc-monitor", "status", "--host", "localhost" ]
          # Give it i + p * f seconds to be ready, so 120 seconds
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 20
        # Monitor ongoing liveness
        livenessProbe:
          exec:
            command: ["/usr/local/bin/mc-monitor", "status", "--host", "localhost"]
          initialDelaySeconds: 120
          periodSeconds: 60
        volumeMounts:
        - name: mc-data
          mountPath: /data
      volumes:
      - name: mc-data
        persistentVolumeClaim:
          claimName: minecraft-servername-pvc
          readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-servername-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-servername-deployment
  namespace: default
  annotations:
    "mc-router.itzg.me/externalServerName": "your-awesome-server.public-domain.com"
spec:
  ports:
  - port: 25565
  selector:
    app: minecraft-servername-container
