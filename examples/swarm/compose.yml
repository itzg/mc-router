services:
  # Isolate root-level access to the docker socket
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    user: root
    environment:
      CONTAINERS: 1
      SERVICES: 1
      NODES: 1
      TASKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - minecraft

  # ...to be used by other services such as mc-router
  router:
    image: itzg/mc-router:latest
    command: --in-docker-swarm --docker-socket=tcp://socket-proxy:2375
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - "25565:25565"
    networks:
      - minecraft

  mcfoobar:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "mc-router.host=foo.host.name,bar.host.name"
        - "mc-router.network=minecraft" # not required in this case
    volumes:
      - mcfoobardata:/data
    networks:
      - minecraft
    environment:
      EULA: "true"

  mcbaz:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "mc-router.host=baz.host.name"
        - "mc-router.network=minecraft" # required since we are exposing a port
    ports:
      - "25575:25575" # RCON
    volumes:
      - mcbazdata:/data
    networks:
      - minecraft
    environment:
      EULA: "true"

volumes:
  mcbazdata:
  mcfoobardata:


networks:
  minecraft:
    driver: overlay
